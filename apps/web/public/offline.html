<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión — Razón Común</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F4F8FD;
         font-family:Montserrat,'Segoe UI',Arial,Helvetica,sans-serif; color:#232A3B; }
  main { text-align:center; padding:32px; max-width:420px; }
  img  { height:34px; width:auto; filter:invert(1) brightness(0.2); }
  h1   { font-size:22px; margin:24px 0 8px; }
  p    { font-size:14.5px; color:#5A6780; line-height:1.55; margin:0 0 20px; }
  button { padding:12px 28px; font-size:14px; font-weight:700; color:#fff; background:#1B3D9C;
           border:0; border-radius:10px; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<main>
  <img src="/logo-rc.png" alt="Razón Común">
  <h1>Sin conexión</h1>
  <p>La participación aquí es en vivo — votos, propuestas y cuentas al día — así que no te
     enseñamos datos viejos de una caché. En cuanto recuperes la conexión, seguimos.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
